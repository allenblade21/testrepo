name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: beverage-price-comparison

jobs:
  pytest:
    name: pytest（全量单元/接口/边界/覆盖测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beverage-price-comparison/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  e2e:
    name: E2E（加载更多分页回归）
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beverage-price-comparison/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install playwright playwright-core
      - run: npx playwright install --with-deps chromium
      - name: 启动服务并执行 E2E
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8077 --log-level warning &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8077/health && break; sleep 1; done
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          node tests/e2e/load_more.spec.mjs "$CHROME"
