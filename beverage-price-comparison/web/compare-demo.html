/* ===== 匹配引擎（商户+商品 单元键）===== */
const norm = s => s.replace(/[\s　/／·,，、]+/g,'').toLowerCase();
const unitKey = l => l.bc ? `${norm(l.m)}|b:${l.bc}` : `${norm(l.m)}|m:${norm(l.b)}|${norm(l.n)}|${norm(l.s)}`;
function buildUnits(listings){
  const g = {};
  listings.forEach(l => { const k = unitKey(l); if(!g[k]) g[k] = []; g[k].push(l); });
  const units = Object.entries(g).map(([k, ls], i) => {
    const r = ls[0];
    return { id:'u'+i, merchant:r.m, name:`${r.b} ${r.n} ${r.s}`, brand:r.b, spec:r.s, type:r.t, listings:ls };
  });
  units.sort((a,b)=> b.listings.length-a.listings.length || a.merchant.localeCompare(b.merchant) || a.name.localeCompare(b.name));
  return units;
}
const UNITS = buildUnits(LISTINGS);
function searchUnits(q){
  const nq = norm(q||'');
  if(!nq) return UNITS;
  return UNITS.filter(u => (norm(u.name)+norm(u.merchant)+u.listings.map(l=>norm(l.n+l.b+l.m)).join('')).includes(nq));
}

/* ===== 到手价引擎（v0.3：首单券 + 封顶防负价）===== */
const KIND_ORDER = {&quot;第二件半价&quot;:0,&quot;满减&quot;:1,&quot;补贴&quot;:2,&quot;券&quot;:3,&quot;首单券&quot;:4};
function computePrice(l, qty, includeDelivery, minOrder, foOn){
  qty = Math.max(1, qty|0);
  const subtotal = l.sp * qty;
  const lines = [{label:&quot;售价小计&quot;, amount:subtotal}];
  const ord = k => KIND_ORDER[k] !== undefined ? KIND_ORDER[k] : 99;
  let promos = l.pr.slice();
  if(foOn &amp;&amp; FIRST_ORDER[l.pf]){
    const f = FIRST_ORDER[l.pf];
    promos.push({kind:&quot;首单券&quot;, desc:f.desc, value:f.value, threshold:f.threshold});
  }
  promos.sort((a,b)=>ord(a.kind)-ord(b.kind));
  let cur = subtotal, disc = 0;
  for(const p of promos){
    let a = 0;
    if(p.kind===&quot;第二件半价&quot;){ if(qty>=2) a = Math.floor(l.sp/2)*Math.floor(qty/2); }
    else if(p.kind===&quot;满减&quot;){ a = cur>=p.threshold ? p.value : 0; }
    else if(p.kind===&quot;补贴&quot;){ a = Math.min(p.value, cur); }
    else if(p.kind===&quot;券&quot;||p.kind===&quot;首单券&quot;){ a = cur>=p.threshold ? p.value : 0; }
    a = Math.min(a, cur);
    if(a>0){ cur-=a; disc+=a; lines.push({label:p.desc, amount:-a, fo:p.kind===&quot;首单券&quot;}); }
  }
  let fee = 0;
  if(includeDelivery){
    const d = DELIVERY[l.pf];
    fee = subtotal>=d.freeOver ? 0 : d.base;
    lines.push({label: fee>0 ? &quot;配送费&quot; : `配送费（满${d.freeOver/100}元免）`, amount:fee});
    cur += fee;
  }
  const orderable = subtotal >= minOrder;
  return { platform:l.pf, final:cur, orderable, lines,
           note: orderable ? &quot;&quot; : `未达起送价${minOrder/100}元，不可下单` };
}

function haversineKm(a1,o1,a2,o2){
  const r=6371, p1=a1*Math.PI/180, p2=a2*Math.PI/180,
        dp=(a2-a1)*Math.PI/180, dl=(o2-o1)*Math.PI/180;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*r*Math.asin(Math.sqrt(h));
}
function resolveGridLocal(lat,lng){
  let best=null;
  for(const gid in GRIDS){
    const g=GRIDS[gid], d=haversineKm(lat,lng,g.lat,g.lng);
    if(!best||d<best.d) best={gid,name:g.name,d};
  }
  return best &amp;&amp; best.d<=GRID_RADIUS_KM ? best : null;
}
function inGrid(m){ return !curGrid || (MERCHANT_GEO[m]&amp;&amp;MERCHANT_GEO[m][2]===curGrid); }
function merchantRank(m, avgPlatforms, maxSales){
  const g=MERCHANT_GEO[m], grid=GRIDS[curGrid];
  const cov=Math.max(0,Math.min(1,0.6+(avgPlatforms-2)*0.4));
  const sales=maxSales?g[4]/maxSales:0;
  const km=haversineKm(g[0],g[1],grid.lat,grid.lng);
  const decay=km<=1?1:(km<=3?1-(km-1)*0.4:0.1);
  return {score:0.35*cov+0.25*sales+0.20*decay+0.20*g[3]/5, km:km};
}

// 点击后：显式向浏览器申请定位权限（Permissions API 预探测 + 原生授权弹窗）
async function useMyLocation(){
  const btn=document.getElementById('gpsbtn'), msg=document.getElementById('locmsg');
  msg.textContent='';
  if(!('geolocation' in navigator)){ msg.textContent='当前浏览器不支持定位，请手动选择商圈'; return; }
  if(window.self!==window.top){
    msg.textContent='当前为嵌入/预览页面（如本 Demo 内嵌显示），浏览器默认禁止内嵌页申请定位。请在独立标签页打开，或直接手动选择商圈 👇';
    return;
  }
  if(window.isSecureContext===false){ msg.textContent='定位需要 HTTPS 安全环境，请手动选择商圈'; return; }
  if(navigator.permissions &amp;&amp; navigator.permissions.query){
    try{
      const st=await navigator.permissions.query({name:'geolocation'});
      if(st.state==='denied'){
        msg.textContent='定位权限已被浏览器拒绝：请点击地址栏 🔒 → 允许「位置」→ 刷新重试，或手动选择商圈';
        return;
      }
    }catch(e){}
  }
  btn.disabled=true; btn.textContent='⊕ 正在申请定位权限…';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      btn.disabled=false; btn.textContent='⊕ 使用当前位置（GPS）';
      const hit=resolveGridLocal(pos.coords.latitude,pos.coords.longitude);
      if(hit){ setGrid(hit.gid,hit.name); }
      else{ msg.textContent='当前位置不在演示服务区（网格位于北京：望京/国贸/中关村/五道口），请手动选择商圈'; }
    },
    err=>{
      btn.disabled=false; btn.textContent='⊕ 使用当前位置（GPS）';
      msg.textContent = err.code===1?'你拒绝了定位授权，请手动选择商圈（重新授权：地址栏 🔒 → 允许位置 → 刷新）'
                       : (err.code===3?'定位超时，请重试或手动选择商圈':'定位失败，请手动选择商圈');
    },
    {enableHighAccuracy:false, timeout:8000, maximumAge:300000}
  );
}

let mqTimer = null;

function searchMerchants(){
  const q = document.getElementById('mq').value.trim();
  const box = document.getElementById('mgroups');
  if(!q){ box.innerHTML = ''; return; }
  const nq = norm(q);
  const groups = {};
  UNITS.forEach(u => {
    if(norm(u.merchant).includes(nq) &amp;&amp; inGrid(u.merchant)){
      (groups[u.merchant] = groups[u.merchant] || []).push(u);
    }
  });
  let names = Object.keys(groups);
  if(!names.length){
    box.innerHTML = `<div class=&quot;empty-m&quot;>${curGrid?curGridName+'内':''}没有匹配的商户，换个名字试试～</div>`;
    return;
  }
  let ranks = {};
  if(curGrid){
    const maxSales = Math.max.apply(null, names.map(m=>MERCHANT_GEO[m][4]));
    names.forEach(m=>{
      const avgP = groups[m].reduce((s,u)=>s+u.listings.length,0)/groups[m].length;
      ranks[m] = merchantRank(m, avgP, maxSales);
    });
    names.sort((a,b)=> ranks[b].score - ranks[a].score);
  } else {
    names.sort((a,b)=> groups[b].length-groups[a].length || a.localeCompare(b));
  }
  box.innerHTML = names.map(m => `
    <div class=&quot;mgroup&quot;>
      <div class=&quot;mname&quot;>🏪 ${m}
        ${ranks[m]?`<span class=&quot;mdist&quot;>${ranks[m].km.toFixed(2)}km · 排名分${ranks[m].score.toFixed(2)}</span>`:''}
        <span class=&quot;mcount&quot;>${groups[m].length} 个可比商品 · 点击直接比价</span></div>
      <div class=&quot;plist&quot;>${groups[m].map(u => `
        <button class=&quot;pchip&quot; onclick=&quot;doCompare('${u.id}')&quot;>${u.name}<span class=&quot;pn&quot;>${u.listings.length}平台</span></button>`).join('')}
      </div>
    </div>`).join('');
}

function compareUnit(u, qty, inc, fo){
  const rows = u.listings.map(l => computePrice(l, qty, inc, STORE_MIN_ORDER[l.m+'|'+l.pf] || 0, !!fo[l.pf]));
  rows.sort((a,b)=> (a.orderable===b.orderable ? a.final-b.final : (a.orderable?-1:1)));
  const ok = rows.filter(r=>r.orderable);
  const cheapest = ok.length ? ok.reduce((m,r)=>r.final<m.final?r:m) : null;
  const savings = ok.length>1 ? Math.max.apply(null, ok.map(r=>r.final)) - cheapest.final : null;
  return {rows, cheapest, savings};
}

function doCompare(id){
  const u = UNITS.find(x=>x.id===id); if(!u) return;
  currentUnit = u;
  document.querySelectorAll('.unit').forEach(e=>e.classList.remove('active'));
  const card = document.getElementById('card-'+id); if(card) card.classList.add('active');
  const qty = +document.getElementById('qty').value || 1;
  const inc = document.getElementById('delivery').checked;
  const fo = foSet();
  const r = compareUnit(u, qty, inc, fo);
  const cols = r.rows.map(x=>`
    <div class=&quot;col ${r.cheapest&amp;&amp;x.platform===r.cheapest.platform?'best':''} ${x.orderable?'':'off'}&quot;>
      ${r.cheapest&amp;&amp;x.platform===r.cheapest.platform?'<span class=&quot;badge&quot;>最便宜</span>':''}
      <div class=&quot;plat&quot;>${x.platform}</div>
      <div class=&quot;price&quot;>${x.orderable?yuan(x.final):'—'}<small>到手</small></div>
      ${x.note?`<div class=&quot;no&quot;>${x.note}</div>`:''}
      <div class=&quot;bd&quot;>${x.lines.map(b=>`
        <div class=&quot;row ${b.amount<0?'minus':''} ${b.fo?'forow':''}&quot;><span>${b.fo?'🎫 ':''}${b.label}</span>
        <span class=&quot;amt&quot;>${b.amount<0?'−':''}${yuan(Math.abs(b.amount))}</span></div>`).join('')}
      </div>
    </div>`).join('');
  const foList = PLATFORMS.filter(p=>fo[p]);
  document.getElementById('detail').innerHTML = `
    <div class=&quot;cmp&quot;>
      <h2>${u.name}</h2>
      <div class=&quot;sub&quot;>🏪 ${u.merchant} · 数量 ×${qty} · ${inc?'含配送费':'不含配送费'} · ${foList.length?('首单券: '+foList.join('/')):'未启用首单券'}</div>
      <div class=&quot;cols&quot;>${cols}</div>
      ${r.savings? `<div class=&quot;save&quot;>✅ 选「${r.cheapest.platform}」最省，比最贵的平台省 ${yuan(r.savings)}</div>`:''}
    </div>`;
  recordComparison(u, qty, inc, foList, r);
  const el = document.getElementById('detail');
  const reduced = window.matchMedia &amp;&amp; matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{ el.scrollIntoView({behavior: reduced?'auto':'smooth', block:'nearest'}); }catch(e){ el.scrollIntoView(false); }
}

/* ===== 会话比价记录 + 导出 PDF（Demo 用浏览器打印兜底）===== */
let compareHistory = [];
function recordComparison(u, qty, inc, foList, r){
  const key = `${u.id}|${qty}|${inc}|${foList.join(',')}`;
  compareHistory = compareHistory.filter(x => x.key !== key);
  compareHistory.push({key, name:u.name, merchant:u.merchant, qty, inc, foList, rows:r.rows, cheapest:r.cheapest, savings:r.savings});
  const bar = document.getElementById('exportbar');
  bar.hidden = false;
  document.getElementById('exportcount').textContent = `已比价 ${compareHistory.length} 项，可导出为 PDF（浏览器打印→另存为 PDF）`;
}
function clearHistory(){ compareHistory = []; document.getElementById('exportbar').hidden = true; }
function exportPdf(){
  if(!compareHistory.length) return;
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const items = compareHistory.map((h,i)=>{
    const rows = h.rows.map(x=>{
      const detail = x.lines.map(b=>`${b.label}${b.amount<0?'−':''}${yuan(Math.abs(b.amount))}`).join('  ');
      const price = x.orderable ? yuan(x.final) : '—';
      const status = x.platform===(h.cheapest&amp;&amp;h.cheapest.platform) ? '✔最便宜' : (x.orderable?'可下单':x.note);
      const best = h.cheapest &amp;&amp; x.platform===h.cheapest.platform;
      return `<tr class=&quot;${best?'best':''}&quot;><td>${x.platform}</td><td>${price}</td><td>${detail}</td><td>${status}</td></tr>`;
    }).join('');
    const sub = `🏪 ${h.merchant} · 数量 ×${h.qty} · ${h.inc?'含配送费':'不含配送费'}${h.foList.length?(' · 首单券: '+h.foList.join('/')):''}`;
    const save = h.savings ? `<div class=&quot;save&quot;>→ 选「${h.cheapest.platform}」最省，比最贵平台省 ${yuan(h.savings)}</div>` : '';
    return `<div class=&quot;pitem&quot;><h2>${i+1}. ${h.name}</h2><div class=&quot;psub&quot;>${sub}</div>
      <table><thead><tr><th>平台</th><th>到手价</th><th>明细</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>${save}</div>`;
  }).join('');
  document.getElementById('printarea').innerHTML =
    `<h1>饮品比价结果</h1><div class=&quot;pmeta&quot;>导出时间：${ts}</div>`
    + `<div class=&quot;pmeta&quot;>共 ${compareHistory.length} 项 · 阿里闪购 / 京东 / 美团 · 演示数据（Mock），非真实价格</div>${items}`;
  window.print();
}

function runReport(){
  let pass = 0;
  const rows = SCENARIOS.map(s=>{
    const u = searchUnits(s.q).find(x=>x.merchant.indexOf(s.m)>=0);
    const fo = {}; s.fo.forEach(p=>{fo[p]=true;});
    const r = compareUnit(u, s.qty, s.del, fo);
    const actP = r.cheapest ? r.cheapest.platform : '—';
    const actF = r.cheapest ? r.cheapest.final : null;
    const ok = actP===s.expP &amp;&amp; actF===s.expF;
    if(ok) pass++;
    return `<tr><td><b>${s.id}</b></td><td>${s.label}</td>
      <td>×${s.qty}${s.del?'':'·不含配送'}${s.fo.length?'·🎫':''}</td>
      <td>${s.expP}</td><td>${actP}</td>
      <td class=&quot;num&quot;>${yuan(s.expF)}</td><td class=&quot;num&quot;>${actF!=null?yuan(actF):'—'}</td>
      <td class=&quot;${ok?'pass':'fail'}&quot;>${ok?'PASS':'FAIL'}</td></tr>`;
  });
  document.getElementById('report').innerHTML = rows.join('');
  document.getElementById('stats').innerHTML = `
    <div class=&quot;stat&quot;><div class=&quot;v&quot;>${UNITS.length}</div><div class=&quot;k&quot;>可比单元</div></div>
    <div class=&quot;stat&quot;><div class=&quot;v&quot;>${LISTINGS.length}</div><div class=&quot;k&quot;>平台条目</div></div>
    <div class=&quot;stat ok&quot;><div class=&quot;v&quot;>${pass}/${SCENARIOS.length}</div><div class=&quot;k&quot;>场景通过</div></div>

}

    到手价 = 团购价 − 补贴（封顶不为负）+ 包间费；人均 = 到手价 ÷ 人数（未选取区间中值）。金额以「分」存储，展示换算「元」。

<script>
// ===== 种子数据（与 app/tuangou/seed_deals.py 一致，金额单位：分）=====
const RESTAURANTS = {
  r_haidilao_wj:{name:&quot;海底捞(望京店)&quot;,cuisine:&quot;火锅&quot;,grid:&quot;望京商圈&quot;,rating:4.8,avg:12000},
  r_xibei_gm:{name:&quot;西贝莜面村(国贸店)&quot;,cuisine:&quot;正餐&quot;,grid:&quot;国贸商圈&quot;,rating:4.6,avg:8000},
  r_fengmao_zgc:{name:&quot;丰茂烤串(中关村店)&quot;,cuisine:&quot;烧烤&quot;,grid:&quot;中关村商圈&quot;,rating:4.5,avg:7000},
};
const DEALS = [
  {id:&quot;d_hdl_4p&quot;,rid:&quot;r_haidilao_wj&quot;,platform:&quot;美团点评&quot;,title:&quot;海底捞欢聚 4 人套餐&quot;,
   party:[3,5],list:52000,group:39800,subsidy:3000,deeplink:&quot;https://dpurl.cn/mock/hdl4p?cps=BPC&quot;,
   menu:[[&quot;番茄锅底&quot;,&quot;1 份&quot;,0],[&quot;肥牛卷&quot;,&quot;2 份&quot;,0],[&quot;虾滑&quot;,&quot;1 份&quot;,0],[&quot;时蔬拼盘&quot;,&quot;1 份&quot;,0],[&quot;小酥肉&quot;,&quot;1 份&quot;,0],[&quot;果盘&quot;,&quot;1 份&quot;,1]],
   rule:{time:&quot;全天&quot;,reserve:true,limit:1,extra:0,stack:false,refund:&quot;随时退&quot;}},
  {id:&quot;d_xibei_room&quot;,rid:&quot;r_xibei_gm&quot;,platform:&quot;美团点评&quot;,title:&quot;西贝家庭聚餐包间套餐（4 人）&quot;,
   party:[4,4],list:36800,group:29800,subsidy:0,deeplink:&quot;https://dpurl.cn/mock/xibei?cps=BPC&quot;,
   menu:[[&quot;莜面鱼鱼&quot;,&quot;1 份&quot;,0],[&quot;牛大骨&quot;,&quot;1 份&quot;,0],[&quot;羊肉串&quot;,&quot;10 串&quot;,0],[&quot;沙棘汁&quot;,&quot;1 扎&quot;,0]],
   rule:{time:&quot;工作日 · 避开节假日&quot;,reserve:true,limit:1,extra:5000,stack:false,refund:&quot;过期退&quot;}},
  {id:&quot;d_fengmao&quot;,rid:&quot;r_fengmao_zgc&quot;,platform:&quot;美团点评&quot;,title:&quot;丰茂烤串 3-4 人欢聚套餐&quot;,
   party:[3,4],list:24900,group:19900,subsidy:1000,deeplink:&quot;https://dpurl.cn/mock/fengmao?cps=BPC&quot;,
   menu:[], // 菜品明细缺失 → 降级
   rule:{time:&quot;全天&quot;,reserve:false,limit:2,extra:0,stack:true,refund:&quot;随时退&quot;}},
  {id:&quot;d_hdl_2p&quot;,rid:&quot;r_haidilao_wj&quot;,platform:&quot;美团点评&quot;,title:&quot;海底捞双人套餐&quot;,
   party:[2,2],list:21800,group:16800,subsidy:20000,deeplink:&quot;https://dpurl.cn/mock/hdl2p?cps=BPC&quot;,
   menu:[[&quot;番茄锅底&quot;,&quot;1 份&quot;,0],[&quot;肥牛卷&quot;,&quot;1 份&quot;,0],[&quot;宽粉&quot;,&quot;1 份&quot;,0]],
   rule:{time:&quot;全天&quot;,reserve:false,limit:1,extra:0,stack:false,refund:&quot;随时退&quot;}},
];

const yuan = c => &quot;¥&quot; + (c/100).toFixed(c%100?2:0);
const midpoint = p => Math.max(1, Math.floor((p[0]+p[1])/2));

// ===== 到手价引擎（复刻 app/tuangou/pricing.py）=====
function computeDeal(deal, party){
  let current = deal.group;
  const lines = [{label:&quot;团购价&quot;, amt:deal.group, kind:&quot;base&quot;}];
  let subsidy = 0;
  if(deal.subsidy>0){ subsidy = Math.min(deal.subsidy,current); current-=subsidy;
    lines.push({label:&quot;平台补贴 / 神券&quot;, amt:-subsidy, kind:&quot;minus&quot;}); }
  const extra = deal.rule.extra;
  if(extra>0){ current+=extra; lines.push({label:&quot;包间费 / 服务费&quot;, amt:extra, kind:&quot;plus&quot;}); }
  const people = (party &amp;&amp; party>0) ? party : midpoint(deal.party);
  const perCap = Math.round(current/people);
  return {final:current, subsidy, extra, people, perCap, lines,
    hasMenu:deal.menu.length>0};
}
const partyMatch = (p,want)=> !want || (p[0]<=want &amp;&amp; want<=p[1]);

// ===== 渲染 =====
let state={party:0,q:&quot;&quot;};
const cardsEl=document.getElementById(&quot;cards&quot;), countEl=document.getElementById(&quot;count&quot;);

function ruleRow(k,v,warn){return `<div><span class=&quot;k&quot;>${k}</span><span class=&quot;v ${warn?'warnv':''}&quot;>${v}</span></div>`;}

function render(){
  const nq=state.q.trim().toLowerCase();
  const hits=DEALS.filter(d=>{
    if(!partyMatch(d.party,state.party)) return false;
    const r=RESTAURANTS[d.rid];
    const hay=(r.name+r.cuisine+d.title).toLowerCase();
    return !nq || hay.includes(nq);
  });
  countEl.textContent = `命中 ${hits.length} 个团购套餐单元` + (state.party?`（适用 ${state.party} 人）`:&quot;&quot;) ;
  if(!hits.length){ cardsEl.innerHTML=`<div class=&quot;empty&quot;>没有匹配的套餐，换个人数或关键词试试。</div>`; return; }

  cardsEl.innerHTML = hits.map(d=>{
    const r=RESTAURANTS[d.rid];
    const res=computeDeal(d, state.party);
    const menuHtml = res.hasMenu
      ? `<div><div class=&quot;sect-l&quot;>套餐菜品</div><div class=&quot;menu&quot;>${d.menu.map(m=>`<span class=&quot;mi&quot;>${m[0]} · ${m[1]}${m[2]?'<span class=&quot;gift&quot;>赠</span>':''}</span>`).join(&quot;&quot;)}</div></div>`
      : `<div class=&quot;degrade&quot;><span>⚠️</span><span><b>未含菜品明细</b>（数据源未授权该字段）。联盟/CPS 取数未必含套餐菜品清单——系统如实标注并降级，不假装可比菜品。</span></div>`;
    const rows = res.lines.map(l=>{
      const cls = l.kind===&quot;minus&quot;?&quot;minus&quot;:(l.kind===&quot;plus&quot;?&quot;plus&quot;:&quot;&quot;);
      const val = (l.kind===&quot;minus&quot;?&quot;− &quot;+yuan(-l.amt):(l.kind===&quot;plus&quot;?&quot;+ &quot;+yuan(l.amt):yuan(l.amt)));
      return `<tr class=&quot;${cls}&quot;><td>${l.label}</td><td class=&quot;r&quot;>${val}</td></tr>`;
    }).join(&quot;&quot;);
    return `
    <div class=&quot;card&quot; data-id=&quot;${d.id}&quot;>
      <div class=&quot;chead&quot; role=&quot;button&quot; tabindex=&quot;0&quot;>
        <div class=&quot;rest&quot;>
          <span class=&quot;rn&quot;>${d.title}</span>
          <span class=&quot;meta&quot;>
            <span class=&quot;tag&quot;>${r.name}</span>
            <span class=&quot;tag&quot;>${r.cuisine}</span>
            <span class=&quot;tag&quot;>📍 ${r.grid}</span>
            <span class=&quot;star&quot;>★ ${r.rating}</span>
            <span>· ${d.party[0]}-${d.party[1]} 人</span>
          </span>
        </div>
        <div class=&quot;pricemini&quot;>
          <div class=&quot;pc tnum&quot;>${yuan(res.perCap)}</div>
          <div class=&quot;pcl&quot;>人均到手</div>
          <div class=&quot;was tnum&quot;>门市 ${yuan(d.list)}</div>
        </div>
      </div>
      <div class=&quot;detail&quot;><div class=&quot;detail-in&quot;>
        <span class=&quot;conf&quot;>● 匹配置信度：单平台（${d.platform}）</span>

        <table class=&quot;br&quot;>${rows}
          <tr class=&quot;total&quot;><td>套餐到手价</td><td class=&quot;r tnum&quot;>${yuan(res.final)}</td></tr>
        </table>

        <div class=&quot;percap&quot;>
          <div class=&quot;pl&quot;>人均到手价<small>${yuan(res.final)} ÷ ${res.people} 人${state.party?'（按所选人数）':'（人数区间中值）'}</small></div>
          <div class=&quot;pv tnum&quot;>${yuan(res.perCap)}</div>
        </div>

        ${menuHtml}

        <div>
          <div class=&quot;sect-l&quot;>使用规则</div>
          <div class=&quot;rules&quot;>
            ${ruleRow(&quot;可用时段&quot;, d.rule.time, d.rule.time.includes(&quot;避开&quot;))}
            ${ruleRow(&quot;是否需预约&quot;, d.rule.reserve?&quot;需预约&quot;:&quot;免预约&quot;, d.rule.reserve)}
            ${ruleRow(&quot;包间/服务费&quot;, d.rule.extra?yuan(d.rule.extra):&quot;无&quot;, d.rule.extra>0)}
            ${ruleRow(&quot;每桌可用&quot;, d.rule.limit?d.rule.limit+&quot; 张&quot;:&quot;不限&quot;)}
            ${ruleRow(&quot;叠加代金券&quot;, d.rule.stack?&quot;可叠加&quot;:&quot;不可叠加&quot;)}
            ${ruleRow(&quot;退款&quot;, d.rule.refund)}
          </div>
        </div>

        <div>
          <a class=&quot;deeplink&quot; href=&quot;${d.deeplink}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>前往下单 ↗</a>
          <div class=&quot;dnote&quot;>deeplink 带 CPS 参数（转化闭环）：<code style=&quot;font-size:10.5px&quot;>${d.deeplink}</code></div>
        </div>

        <div class=&quot;constraint&quot;>🔒 同门店约束：比价单元内所有套餐限定同一门店（<b>${r.name}</b>）；跨门店比价接口返回 409。</div>
      </div></div>
    </div>`;
  }).join(&quot;&quot;);

  cardsEl.querySelectorAll(&quot;.card&quot;).forEach(card=>{
    const head=card.querySelector(&quot;.chead&quot;);
    const toggle=()=>card.classList.toggle(&quot;open&quot;);
    head.addEventListener(&quot;click&quot;,toggle);
    head.addEventListener(&quot;keydown&quot;,e=>{ if(e.key===&quot;Enter&quot;||e.key===&quot; &quot;){e.preventDefault();toggle();} });
  });
}

// 控件
document.getElementById(&quot;partychips&quot;).addEventListener(&quot;click&quot;,e=>{
  const b=e.target.closest(&quot;.chip&quot;); if(!b) return;
  state.party=+b.dataset.p;
  document.querySelectorAll(&quot;#partychips .chip&quot;).forEach(c=>c.setAttribute(&quot;aria-pressed&quot;, c===b));
  render();
});
document.getElementById(&quot;q&quot;).addEventListener(&quot;input&quot;,e=>{ state.q=e.target.value; render(); });

// 主题
const rootEl=document.documentElement;
document.getElementById(&quot;themebtn&quot;).addEventListener(&quot;click&quot;,()=>{
  const cur=rootEl.getAttribute(&quot;data-theme&quot;)
    || (matchMedia(&quot;(prefers-color-scheme:dark)&quot;).matches?&quot;dark&quot;:&quot;light&quot;);
  rootEl.setAttribute(&quot;data-theme&quot;, cur===&quot;dark&quot;?&quot;light&quot;:&quot;dark&quot;);
});

render();
</script>

<script>
  const tabs=[["t-bev","f-bev"],["t-tg","f-tg"]];
  for(const [tid,fid] of tabs){
    document.getElementById(tid).addEventListener("click",()=>{
      for(const [t2,f2] of tabs){
        document.getElementById(t2).setAttribute("aria-selected", t2===tid);
        document.getElementById(f2).hidden = (f2!==fid);
      }
    });
  }
</script>
