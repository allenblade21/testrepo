<title>餐厅团餐 / 团购比价 · 跨平台 Demo</title>
<style>
  :root{
    --bg:#F7F3EE; --panel:#FFFFFF; --ink:#1C1815; --ink-soft:#6B6157;
    --line:#E4DACE; --line-strong:#D3C6B4;
    --accent:#D8552B; --accent-soft:#F6E3D8; --accent-ink:#9C3A18;
    --good:#3F8A5C; --good-soft:#E1EFE6; --good-ink:#2C6A43;
    --warn:#B8802A; --warn-soft:#F5EAD4;
    --shadow:0 1px 2px rgba(28,24,21,.05),0 8px 24px rgba(28,24,21,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#151210; --panel:#221D19; --ink:#F1EAE1; --ink-soft:#A99E90;
      --line:#332B24; --line-strong:#453A31;
      --accent:#F0703F; --accent-soft:#3A241A; --accent-ink:#F6A780;
      --good:#5FB07E; --good-soft:#1E2E23; --good-ink:#8FD0A6;
      --warn:#D9A94E; --warn-soft:#33290F;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#F7F3EE; --panel:#FFFFFF; --ink:#1C1815; --ink-soft:#6B6157;
    --line:#E4DACE; --line-strong:#D3C6B4;
    --accent:#D8552B; --accent-soft:#F6E3D8; --accent-ink:#9C3A18;
    --good:#3F8A5C; --good-soft:#E1EFE6; --good-ink:#2C6A43;
    --warn:#B8802A; --warn-soft:#F5EAD4;
    --shadow:0 1px 2px rgba(28,24,21,.05),0 8px 24px rgba(28,24,21,.06);
  }
  :root[data-theme="dark"]{
    --bg:#151210; --panel:#221D19; --ink:#F1EAE1; --ink-soft:#A99E90;
    --line:#332B24; --line-strong:#453A31;
    --accent:#F0703F; --accent-soft:#3A241A; --accent-ink:#F6A780;
    --good:#5FB07E; --good-soft:#1E2E23; --good-ink:#8FD0A6;
    --warn:#D9A94E; --warn-soft:#33290F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 64px}
  .tnum{font-variant-numeric:tabular-nums}
  header.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
  .brandmark{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--accent),#B23C16);
    display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:var(--shadow);flex:0 0 auto}
  h1{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance;font-weight:700}
  .sub{color:var(--ink-soft);font-size:12.5px;margin-top:1px}
  .themebtn{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);
    border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .themebtn:hover{color:var(--ink)}
  .mock{display:flex;gap:9px;align-items:center;background:var(--accent-soft);color:var(--accent-ink);
    border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:11px;
    padding:9px 13px;font-size:12.5px;margin:16px 0 22px;font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin-bottom:18px}
  .field{display:flex;flex-direction:column;gap:7px}
  .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:999px;
    padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.14s}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .search{flex:1 1 200px;min-width:170px}
  .search input{width:100%;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
    border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit}
  .search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .count{font-size:12.5px;color:var(--ink-soft);margin:2px 0 14px}
  .cards{display:flex;flex-direction:column;gap:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .chead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:15px 17px;cursor:pointer}
  .chead:hover{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
  .rest{display:flex;flex-direction:column;gap:3px;min-width:0}
  .rest .rn{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
  .rest .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-soft)}
  .star{color:var(--warn)}
  .conf{border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700}
  .conf.exact{background:var(--good-soft);color:var(--good-ink)}
  .conf.fuzzy{background:var(--warn-soft);color:var(--warn)}
  .conf.single{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line)}
  .pricemini{text-align:right;flex:0 0 auto}
  .pricemini .pc{font-size:20px;font-weight:750;letter-spacing:-.02em;color:var(--good-ink)}
  .pricemini .pcl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .detail{border-top:1px dashed var(--line-strong);padding:0 17px;max-height:0;overflow:hidden;transition:max-height .28s ease}
  .card.open .detail{max-height:2200px}
  .detail-in{padding:16px 0 18px;display:flex;flex-direction:column;gap:13px}
  .mnote{font-size:12px;color:var(--warn);background:var(--warn-soft);
    border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);border-radius:9px;padding:8px 12px}
  .plat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .plat.best{border-color:var(--good);background:var(--good-soft)}
  .prow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pname{font-weight:700;font-size:14px}
  .best-badge{color:var(--good-ink);font-size:11px;font-weight:700;background:var(--panel);
    border:1px solid var(--good);border-radius:999px;padding:1px 8px;margin-left:6px}
  .percap{font-size:19px;font-weight:800;color:var(--good-ink)}
  .percap small{font-size:11px;font-weight:500;color:var(--ink-soft)}
  .ptitle{font-size:12px;color:var(--ink-soft);margin:2px 0 6px}
  .bd{font-size:12px;color:var(--ink-soft)}
  .bd span{margin-right:10px}
  .menu{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .mi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px}
  .mi .gift{color:var(--accent);font-weight:600;margin-left:4px}
  .degrade{font-size:11.5px;color:var(--warn);margin-top:6px}
  .rules{font-size:11.5px;color:var(--ink-soft);margin-top:6px}
  .rules b{color:var(--accent-ink)}
  .deeplink{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;margin-top:8px}
  .deeplink:hover{background:#C24A22}
  .savings{font-size:12.5px;color:var(--good-ink);font-weight:700}
  .constraint{font-size:11.5px;color:var(--ink-soft);border-left:3px solid var(--accent);padding:2px 0 2px 11px}
  footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);line-height:1.7}
  .empty{text-align:center;color:var(--ink-soft);padding:38px 0;font-size:14px}
  @media (max-width:520px){ .pricemini .pc{font-size:18px} }
</style>

<div class="wrap">
  <header class="hd">
    <div class="brandmark">
      <div class="logo">🍲</div>
      <div>
        <h1>餐厅团餐 / 团购比价</h1>
        <div class="sub">跨平台 Demo · 同门店三平台并排 · 匹配置信度 · 人均到手价</div>
      </div>
    </div>
    <button class="themebtn" id="themebtn" type="button">◑ 主题</button>
  </header>

  <div class="mock">
    <span>⚠️</span>
    <span><b>Mock 演示数据，非真实价格。</b>展示 v0.9.0 能力：跨平台对齐 + 置信度分级（精确/疑似/单平台）。</span>
  </div>

  <div class="bar">
    <div class="field">
      <span class="lab">用餐人数</span>
      <div class="chips" id="partychips">
        <button class="chip" data-p="0" aria-pressed="true" type="button">全部</button>
        <button class="chip" data-p="2" aria-pressed="false" type="button">2 人</button>
        <button class="chip" data-p="4" aria-pressed="false" type="button">4 人</button>
        <button class="chip" data-p="5" aria-pressed="false" type="button">5 人</button>
      </div>
    </div>
    <div class="field search">
      <span class="lab">搜索</span>
      <input id="q" type="text" placeholder="餐厅名 / 菜系 / 套餐，如 火锅、烤串" autocomplete="off">
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="cards" id="cards"></div>

  <footer>
    与仓库 <b>v0.9.0</b> 同构：可比单元=同门店×人数档；置信度双信号=标题相似度(≥0.6)+价位带(≥0.75)，
    任一不过标「疑似」并给差异原因；到手价=团购价−补贴(封顶不为负)+包间费；人均=到手价÷人数(半数进位)。
    金额以「分」存储，展示换算「元」。
  </footer>
</div>

<script>
// ===== 种子（与 v0.9.0 语义一致；金额分）=====
const RESTAURANTS = {
  r_haidilao:{name:"海底捞(望京店)",cuisine:"火锅",grid:"望京商圈",rating:4.8},
  r_xibei:{name:"西贝莜面村(国贸店)",cuisine:"正餐",grid:"国贸商圈",rating:4.6},
  r_fengmao:{name:"丰茂烤串(中关村店)",cuisine:"烧烤",grid:"中关村商圈",rating:4.5},
};
const DEALS = [
  // —— 海底捞 3-5 人档：三平台对齐 → 精确 ——
  {rid:"r_haidilao",platform:"美团点评",title:"海底捞欢聚4人餐",party:[3,5],
   list:52000,group:39800,subsidy:3000,extra:0,deeplink:"https://dpurl.cn/mock/hdl-mt?cps=BPC",
   menu:[["番茄锅底","1 份",0],["肥牛卷","2 份",0],["虾滑","1 份",0],["时蔬拼盘","1 份",0],["小酥肉","1 份",0],["果盘","1 份",1]],
   rule:{time:"全天",reserve:true,extra:0,refund:"随时退"}},
  {rid:"r_haidilao",platform:"抖音",title:"海底捞欢聚4人餐",party:[3,5],
   list:52000,group:38800,subsidy:0,extra:0,deeplink:"https://v.douyin.com/mock/hdl-dy",
   menu:[],rule:{time:"全天",reserve:true,extra:0,refund:"随时退"}},
  {rid:"r_haidilao",platform:"口碑",title:"海底捞欢聚4人餐超值团",party:[3,5],
   list:52000,group:40800,subsidy:0,extra:0,deeplink:"https://uland.taobao.com/mock/hdl-kb",
   menu:[],rule:{time:"全天",reserve:true,extra:0,refund:"过期退"}},
  // —— 西贝 4 人档：跨平台但标题差异大 → 疑似 ——
  {rid:"r_xibei",platform:"美团点评",title:"西贝家庭聚餐包间套餐（4 人）",party:[4,4],
   list:36800,group:29800,subsidy:0,extra:5000,deeplink:"https://dpurl.cn/mock/xibei-mt?cps=BPC",
   menu:[["莜面鱼鱼","1 份",0],["牛大骨","1 份",0],["羊肉串","10 串",0],["沙棘汁","1 扎",0]],
   rule:{time:"工作日 · 避开节假日",reserve:true,extra:5000,refund:"过期退"}},
  {rid:"r_xibei",platform:"口碑",title:"西贝烤羊腿双人晚市特惠4人份",party:[4,4],
   list:36800,group:31800,subsidy:0,extra:0,deeplink:"https://uland.taobao.com/mock/xibei-kb",
   menu:[],rule:{time:"晚市",reserve:false,extra:0,refund:"随时退"}},
  // —— 丰茂：单平台 + 菜品缺失降级 ——
  {rid:"r_fengmao",platform:"美团点评",title:"丰茂烤串 3-4 人欢聚套餐",party:[3,4],
   list:24900,group:19900,subsidy:1000,extra:0,deeplink:"https://dpurl.cn/mock/fengmao?cps=BPC",
   menu:[],rule:{time:"全天",reserve:false,extra:0,refund:"随时退"}},
  // —— 海底捞双人：单平台 + 补贴超额封顶为 0 ——
  {rid:"r_haidilao",platform:"美团点评",title:"海底捞双人套餐",party:[2,2],
   list:21800,group:16800,subsidy:20000,extra:0,deeplink:"https://dpurl.cn/mock/hdl2p?cps=BPC",
   menu:[["番茄锅底","1 份",0],["肥牛卷","1 份",0],["宽粉","1 份",0]],
   rule:{time:"全天",reserve:false,extra:0,refund:"随时退"}},
];

const yuan = c => "¥" + (c/100).toFixed(c%100?2:0);
const mid = p => Math.max(1, Math.floor((p[0]+p[1])/2));

// ===== 匹配置信度（忠实复刻 app/tuangou/matching.py，阈值 0.6/0.75）=====
const norm = t => (t||"").toLowerCase().replace(/[\s　/／·,，、()（）【】\[\]-]+/g,"");
function titleSim(a,b){
  const na=norm(a), nb=norm(b);
  if(!na||!nb) return 0; if(na===nb) return 1;
  const g=s=>{const r=new Set(); for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2)); if(!r.size)r.add(s); return r;};
  const ga=g(na), gb=g(nb);
  let inter=0; for(const x of ga) if(gb.has(x)) inter++;
  return inter/(ga.size+gb.size-inter);
}
function classify(deals){
  if(new Set(deals.map(d=>d.platform)).size===1) return {conf:"单平台",note:""};
  let minSim=1;
  const prices=deals.map(d=>d.group).filter(x=>x>0);
  const band=prices.length?Math.min(...prices)/Math.max(...prices):0;
  for(let i=0;i<deals.length;i++) for(let j=i+1;j<deals.length;j++)
    minSim=Math.min(minSim,titleSim(deals[i].title,deals[j].title));
  if(minSim>=0.6 && band>=0.75) return {conf:"精确",note:`标题相似${minSim.toFixed(2)}·价位带${band.toFixed(2)}`};
  const r=[];
  if(minSim<0.6) r.push(`标题相似度低(${minSim.toFixed(2)})`);
  if(band<0.75) r.push(`价位差异大(${band.toFixed(2)})`);
  return {conf:"疑似",note:"套餐内容可能有差异："+r.join("、")};
}

// ===== 可比单元构建（同门店×人数档）=====
const UNITS = (()=>{
  const g={};
  for(const d of DEALS){ const k=`${d.rid}|${d.party[0]}-${d.party[1]}`; (g[k]=g[k]||[]).push(d); }
  return Object.entries(g).map(([k,deals])=>{
    const {conf,note}=classify(deals);
    return {key:k,rid:deals[0].rid,party:deals[0].party,deals,conf,note};
  }).sort((a,b)=>b.deals.length-a.deals.length);
})();

// ===== 到手价（团购价−补贴封顶+附加费；人均=半数进位）=====
function compute(d, party){
  let cur=d.group; const lines=[{l:"团购价",a:d.group}];
  const sub=Math.min(d.subsidy||0,cur);
  if(sub>0){cur-=sub;lines.push({l:"平台补贴/神券",a:-sub});}
  if(d.extra>0){cur+=d.extra;lines.push({l:"包间费/服务费",a:d.extra});}
  const people=(party&&party>0)?party:mid(d.party);
  return {final:cur,people,perCap:Math.floor((2*cur+people)/(2*people)),lines,hasMenu:d.menu.length>0};
}
const partyMatch=(p,w)=>!w||(p[0]<=w&&w<=p[1]);
const confCls=c=>c==="精确"?"exact":(c==="疑似"?"fuzzy":"single");

// ===== 渲染 =====
let state={party:0,q:""};
const cardsEl=document.getElementById("cards"), countEl=document.getElementById("count");

function render(){
  const nq=norm(state.q);
  const hits=UNITS.filter(u=>{
    if(!partyMatch(u.party,state.party)) return false;
    const r=RESTAURANTS[u.rid];
    return !nq || norm(r.name+r.cuisine+u.deals.map(d=>d.title).join("")).includes(nq);
  });
  countEl.textContent=`命中 ${hits.length} 个可比套餐单元`+(state.party?`（适用 ${state.party} 人）`:"");
  if(!hits.length){cardsEl.innerHTML=`<div class="empty">没有匹配的套餐，换个人数或关键词试试。</div>`;return;}

  cardsEl.innerHTML=hits.map((u,ui)=>{
    const r=RESTAURANTS[u.rid];
    const results=u.deals.map(d=>({d,res:compute(d,state.party)})).sort((a,b)=>a.res.perCap-b.res.perCap);
    const best=results[0], worst=results[results.length-1];
    const savings=results.length>1?worst.res.perCap-best.res.perCap:0;
    const noteHtml=u.note&&u.conf==="疑似"?`<div class="mnote">⚠️ ${u.note}，请核对菜品后再团。</div>`:"";
    const platsHtml=results.map(({d,res},i)=>{
      const isBest=i===0&&results.length>1;
      const bd=res.lines.map(l=>`<span>${l.l} ${l.a<0?"−":""}${yuan(Math.abs(l.a))}</span>`).join("");
      const menu=res.hasMenu
        ?`<div class="menu">${d.menu.map(m=>`<span class="mi">${m[0]} · ${m[1]}${m[2]?'<span class="gift">赠</span>':''}</span>`).join("")}</div>`
        :`<div class="degrade">⚠️ 未含菜品明细（数据源未授权该字段）</div>`;
      return `<div class="plat ${isBest?"best":""}">
        <div class="prow"><span class="pname">${d.platform}${isBest?'<span class="best-badge">最划算</span>':""}</span>
          <span class="percap tnum">${yuan(res.perCap)}<small> /人（${res.people}人）</small></span></div>
        <div class="ptitle">${d.title} · 到手 ${yuan(res.final)} · 门市 <s>${yuan(d.list)}</s></div>
        <div class="bd">${bd}</div>${menu}
        <div class="rules">时段 ${d.rule.time} · ${d.rule.reserve?"<b>需预约</b>":"免预约"}${d.rule.extra?` · 包间费 ${yuan(d.rule.extra)}`:""} · ${d.rule.refund}</div>
        <a class="deeplink" href="${d.deeplink}" target="_blank" rel="noopener">去 ${d.platform} 下单 ↗</a>
      </div>`;
    }).join("");
    return `
    <div class="card" data-i="${ui}">
      <div class="chead" role="button" tabindex="0">
        <div class="rest">
          <span class="rn">${r.name}</span>
          <span class="meta">
            <span class="tag">${r.cuisine}</span>
            <span class="tag">📍 ${r.grid}</span>
            <span class="star">★ ${r.rating}</span>
            <span>${u.party[0]}-${u.party[1]} 人</span>
            <span class="conf ${confCls(u.conf)}">${u.conf}</span>
            <span>${u.deals.map(d=>d.platform).join(" · ")}</span>
          </span>
        </div>
        <div class="pricemini">
          <div class="pc tnum">${yuan(best.res.perCap)}</div>
          <div class="pcl">人均到手起</div>
        </div>
      </div>
      <div class="detail"><div class="detail-in">
        ${noteHtml}${platsHtml}
        ${savings?`<div class="savings">最优比最贵人均省 ${yuan(savings)}</div>`:""}
        <div class="constraint">🔒 同门店约束：单元内所有套餐限定 <b>${r.name}</b>；跨门店比价拒绝（409）。</div>
      </div></div>
    </div>`;
  }).join("");

  cardsEl.querySelectorAll(".card").forEach(card=>{
    const head=card.querySelector(".chead");
    const toggle=()=>card.classList.toggle("open");
    head.addEventListener("click",toggle);
    head.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
  });
}

document.getElementById("partychips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  state.party=+b.dataset.p;
  document.querySelectorAll("#partychips .chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  render();
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});

const rootEl=document.documentElement;
document.getElementById("themebtn").addEventListener("click",()=>{
  const cur=rootEl.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  rootEl.setAttribute("data-theme",cur==="dark"?"light":"dark");
});

render();
</script>
